<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>African Food Comparator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f172a;
      --card: #111827;
      --accent: #f59e0b;
      --muted: #cbd5e1;
      --border: #1f2937;
      --text: #e2e8f0;
      --pill: #1d4ed8;
    }

    * {
      box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    body {
      margin: 0;
      background: radial-gradient(circle at 10% 20%, #1e1b4b 0, transparent 25%),
                  radial-gradient(circle at 80% 0%, #1d4ed8 0, transparent 30%),
                  var(--bg);
      color: var(--text);
    }

    header {
      padding: 56px 24px 32px;
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 2.4rem;
      letter-spacing: -0.02em;
    }

    p.subtitle {
      margin: 0 auto;
      max-width: 760px;
      color: var(--muted);
      line-height: 1.6;
    }

    main {
      max-width: 1080px;
      margin: 0 auto 72px;
      padding: 0 24px;
    }

    .panel {
      background: linear-gradient(135deg, #0b1224, #0f172a);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.28);
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-weight: 600;
      letter-spacing: 0.01em;
    }

    select {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #0b1221;
      color: var(--text);
      font-size: 1rem;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.25);
    }

    button {
      margin-top: 8px;
      padding: 12px 16px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #f59e0b, #f97316);
      color: #0b0f19;
      font-weight: 700;
      letter-spacing: 0.02em;
      cursor: pointer;
      box-shadow: 0 14px 34px rgba(249, 115, 22, 0.35);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 18px 38px rgba(249, 115, 22, 0.45);
    }

    button:active {
      transform: translateY(0);
      box-shadow: 0 10px 24px rgba(249, 115, 22, 0.3);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 18px;
      margin-top: 16px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
    }

    .card h3 {
      margin: 0 0 8px;
      font-size: 1.35rem;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(245, 158, 11, 0.14);
      color: var(--accent);
      font-weight: 700;
      letter-spacing: 0.02em;
      font-size: 0.9rem;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 12px 0;
    }

    .pill {
      background: rgba(29, 78, 216, 0.16);
      color: #c3dafe;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 0.85rem;
      border: 1px solid rgba(59, 130, 246, 0.3);
    }

    .description {
      color: var(--muted);
      line-height: 1.6;
      margin: 12px 0;
    }

    .facts {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      margin-top: 12px;
    }

    .fact {
      background: #0b1221;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .fact strong {
      display: block;
      color: var(--text);
      margin-bottom: 4px;
    }

    .insight {
      margin-top: 10px;
      padding: 14px;
      border-radius: 12px;
      background: rgba(59, 130, 246, 0.1);
      border: 1px solid rgba(59, 130, 246, 0.2);
      color: #c3dafe;
      line-height: 1.6;
    }

    footer {
      text-align: center;
      color: var(--muted);
      padding: 28px 16px 38px;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Compare African Dishes</h1>
    <p class="subtitle">Explore iconic dishes across the continent. Pick two meals to see what sets them apart—origins, flavors, and the ingredients that give each plate its character.</p>
  </header>

  <main>
    <section class="panel" aria-label="Food comparison selector">
      <div class="controls">
        <div>
          <label for="foodA">First dish</label>
          <select id="foodA"></select>
        </div>
        <div>
          <label for="foodB">Second dish</label>
          <select id="foodB"></select>
        </div>
      </div>
      <button id="compareButton">Compare dishes</button>
    </section>

    <section class="panel" style="margin-top: 22px;">
      <div class="grid" id="comparisonGrid">
        <div class="card" id="cardA" aria-live="polite"></div>
        <div class="card" id="cardB" aria-live="polite"></div>
      </div>
      <div class="insight" id="insight"></div>
    </section>
  </main>

  <footer>
    Celebrating food traditions across Africa—pick, compare, and get inspired.
  </footer>

  <script src="app.js"></script>
</body>
</html>
